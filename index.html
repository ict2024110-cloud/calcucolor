<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CalcuColor — Calculator & Color Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="https://github.com/ict2024110-cloud" target="_blank" rel="noopener" class="logo-link" aria-label="GitHub profile">
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">CalcuColor</span>
      </div>
    </a>
    <nav class="header-nav">
      <button class="nav-tab active" data-panel="calculator" aria-label="Calculator panel">Calculator</button>
      <button class="nav-tab" data-panel="palette" aria-label="Color palette panel">Colors</button>
      <button class="nav-tab" data-panel="converter" aria-label="Converter panel">Convert</button>
    </nav>
    <button class="mute-btn" id="muteBtn" aria-label="Toggle sound" title="Toggle sound">
      <span class="mute-icon">🔊</span>
    </button>
  </header>

  <!-- Main app -->
  <main class="app-container">

    <!-- ── CALCULATOR PANEL ── -->
    <section class="panel active" id="panel-calculator" aria-label="Calculator">
      <!-- Mode toggle -->
      <div class="mode-toggle" role="group" aria-label="Calculator mode">
        <button class="mode-btn active" data-mode="basic">Basic</button>
        <button class="mode-btn" data-mode="scientific">Scientific</button>
        <button class="mode-btn" data-mode="binary">Binary</button>
      </div>

      <!-- Display -->
      <div class="calc-display" aria-live="polite">
        <div class="display-expression" id="displayExpr">&nbsp;</div>
        <div class="display-value" id="displayVal">0</div>
      </div>

      <!-- Basic buttons -->
      <div class="keypad" id="keypad-basic">
        <button class="btn btn-fn" data-action="clear">AC</button>
        <button class="btn btn-fn" data-action="sign">±</button>
        <button class="btn btn-fn" data-action="percent">%</button>
        <button class="btn btn-op" data-action="op" data-val="÷">÷</button>

        <button class="btn btn-num" data-action="digit" data-val="7">7</button>
        <button class="btn btn-num" data-action="digit" data-val="8">8</button>
        <button class="btn btn-num" data-action="digit" data-val="9">9</button>
        <button class="btn btn-op" data-action="op" data-val="×">×</button>

        <button class="btn btn-num" data-action="digit" data-val="4">4</button>
        <button class="btn btn-num" data-action="digit" data-val="5">5</button>
        <button class="btn btn-num" data-action="digit" data-val="6">6</button>
        <button class="btn btn-op" data-action="op" data-val="−">−</button>

        <button class="btn btn-num" data-action="digit" data-val="1">1</button>
        <button class="btn btn-num" data-action="digit" data-val="2">2</button>
        <button class="btn btn-num" data-action="digit" data-val="3">3</button>
        <button class="btn btn-op" data-action="op" data-val="+">+</button>

        <button class="btn btn-num btn-zero" data-action="digit" data-val="0">0</button>
        <button class="btn btn-num" data-action="dot">.</button>
        <button class="btn btn-eq" data-action="equals">=</button>
      </div>

      <!-- Scientific extra buttons -->
      <div class="keypad keypad-sci hidden" id="keypad-sci">
        <button class="btn btn-sci" data-action="sci" data-val="sin">sin</button>
        <button class="btn btn-sci" data-action="sci" data-val="cos">cos</button>
        <button class="btn btn-sci" data-action="sci" data-val="tan">tan</button>
        <button class="btn btn-sci" data-action="sci" data-val="log">log</button>
        <button class="btn btn-sci" data-action="sci" data-val="ln">ln</button>
        <button class="btn btn-sci" data-action="sci" data-val="sqrt">√</button>
        <button class="btn btn-sci" data-action="sci" data-val="pow2">x²</button>
        <button class="btn btn-sci" data-action="sci" data-val="pi">π</button>
        <button class="btn btn-sci" data-action="sci" data-val="e">e</button>
        <button class="btn btn-sci" data-action="sci" data-val="inv">1/x</button>
        <button class="btn btn-sci" data-action="sci" data-val="fact">n!</button>
        <button class="btn btn-sci" data-action="backspace">⌫</button>
      </div>

      <!-- Binary keypad -->
      <div class="keypad keypad-bin hidden" id="keypad-bin">
        <button class="btn btn-fn" data-action="clear">AC</button>
        <button class="btn btn-fn" data-action="backspace">⌫</button>
        <button class="btn btn-op" data-action="op" data-val="AND">AND</button>
        <button class="btn btn-op" data-action="op" data-val="OR">OR</button>

        <button class="btn btn-num btn-bin" data-action="digit" data-val="1">1</button>
        <button class="btn btn-num btn-bin" data-action="digit" data-val="0">0</button>
        <button class="btn btn-op" data-action="op" data-val="XOR">XOR</button>
        <button class="btn btn-op" data-action="op" data-val="NOT">NOT</button>

        <button class="btn btn-op" data-action="op" data-val="<<">SHL</button>
        <button class="btn btn-op" data-action="op" data-val=">>">SHR</button>
        <button class="btn btn-op" data-action="op" data-val="+">+</button>
        <button class="btn btn-eq" data-action="equals">=</button>
      </div>
    </section>

    <!-- ── COLOR PALETTE PANEL ── -->
    <section class="panel hidden" id="panel-palette" aria-label="Color palette generator">
      <div class="palette-controls">
        <div class="color-picker-row">
          <label for="baseColor">Base Color</label>
          <input type="color" id="baseColor" value="#6C63FF" />
          <span class="hex-label" id="baseHexLabel">#6C63FF</span>
        </div>
        <div class="scheme-select-row">
          <label for="schemeType">Scheme</label>
          <select id="schemeType">
            <option value="complementary">Complementary</option>
            <option value="triadic">Triadic</option>
            <option value="analogous">Analogous</option>
            <option value="tetradic">Tetradic</option>
            <option value="monochromatic">Monochromatic</option>
            <option value="split-complementary">Split-Complementary</option>
          </select>
        </div>
        <button class="btn btn-gen" id="generatePalette">Generate ✦</button>
        <button class="btn btn-gen btn-random" id="randomPalette">Random 🎲</button>
      </div>

      <div class="swatches" id="swatches" aria-label="Color swatches"></div>

      <div class="palette-export">
        <button class="btn btn-export" id="copyCSSVars">Copy CSS Vars</button>
        <button class="btn btn-export" id="copyHexList">Copy Hex List</button>
      </div>
      <div class="copy-toast" id="copyToast">Copied!</div>
    </section>

    <!-- ── CONVERTER PANEL ── -->
    <section class="panel hidden" id="panel-converter" aria-label="Number converter">
      <h2 class="panel-title">Number Converter</h2>

      <div class="converter-grid">
        <div class="conv-field">
          <label for="decInput">Decimal</label>
          <input type="number" id="decInput" placeholder="e.g. 255" min="0" step="1" />
        </div>
        <div class="conv-field">
          <label for="binInput">Binary</label>
          <input type="text" id="binInput" placeholder="e.g. 11111111" pattern="[01]+" />
        </div>
        <div class="conv-field">
          <label for="hexInput">Hexadecimal</label>
          <input type="text" id="hexInput" placeholder="e.g. FF" />
        </div>
        <div class="conv-field">
          <label for="octInput">Octal</label>
          <input type="text" id="octInput" placeholder="e.g. 377" />
        </div>
      </div>

      <div class="bitvis" id="bitvis" aria-label="Bit visualization"></div>

      <div class="conv-info" id="convInfo"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://github.com/ict2024110-cloud" target="_blank" rel="noopener" class="footer-link">

        GitHub
      </a>
      <a href="https://www.instagram.com/cine.snaper?igsh=cnd0bjRid2tkcHgx" target="_blank" rel="noopener" class="footer-link">

    </div>
    <p class="footer-credit">Built with ♥ · <a href="https://github.com/ict2024110-cloud" target="_blank" rel="noopener">@ict2024110-cloud</a></p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
